services:
  # 1. The FastAPI Backend
  web:
    build: .
    container_name: form_engine_api
    ports:
      - "8000:8000"
    environment:
      # Notice the host is 'db' and port is '5432' (the internal network)
      - DATABASE_URL=postgresql://postgres:mysecretpassword@db:5432/form_engine_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # 2. The PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: form_engine_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: form_engine_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
      image: redis:7-alpine
      container_name: form_engine_redis
      ports:
        - "6379:6379"
volumes:
  postgres_data: